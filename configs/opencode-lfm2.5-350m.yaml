# External harness evaluation; use native training profile for gradient updates.
model:
  name: LiquidAI/LFM2.5-350M
  revision: 9e6c6ccf47cd318696e137d381a7ded8fe4df09f
  tokenizer_revision: 9e6c6ccf47cd318696e137d381a7ded8fe4df09f
  cache_dir: outputs/model-cache
  offline: true
  threads: 4
  profile: lfm2.5
