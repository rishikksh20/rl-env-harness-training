[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coding-rl-lab"
version = "0.1.0"
description = "A small stateful coding environment with independently verifiable rewards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "pytest==8.4.2"]

[project.scripts]
coding-rl = "coding_rl.cli:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: real isolated execution (enable with CODING_RL_DOCKER_TESTS=1)"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/coding_rl/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
