[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "coding-rl-lab"
version = "0.1.0"
description = "A small stateful coding environment with independently verifiable rewards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "pytest==8.4.2"]

[project.optional-dependencies]
rollout = ["torch==2.14.1", "transformers==5.19.0", "huggingface-hub==2.2.0"]
train-cpu = [
  "coding-rl-lab[rollout]",
  "trl==1.16.0",
  "datasets==5.1.0",
  "accelerate==1.15.0",
  "psutil==7.2.2",
]
train-lora = ["coding-rl-lab[train-cpu]", "peft==0.21.2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "rollout" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
coding-rl = "main:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "docker: real isolated execution (enable with CODING_RL_DOCKER_TESTS=1)",
  "native: installed native training API (enable with CODING_RL_NATIVE_TESTS=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/tasks/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
